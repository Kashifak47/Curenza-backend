# src/main/resources/application-prod.properties

# CLOUD DATABASE (Neon DB) - Injected from Koyeb Environment Variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# PRODUCTION JWT
jwt.secret=${JWT_SECRET_KEY}

# PRODUCTION CORS (Your Vercel URL, injected from Koyeb)
cors.allowed-origin=${FRONTEND_URL}

# Keep SQL logs off in production to save server memory and log space
spring.jpa.show-sql=false